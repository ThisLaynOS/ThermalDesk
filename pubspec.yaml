name: zebra_label_pro
description: Professional Zebra ZPL Label Printer App

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  barcode_widget: ^2.0.4
  intl: ^0.19.0
  uuid: ^4.4.0
  mobile_scanner: ^5.1.1
  http: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logow.png
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
  image_path: assets/logo.png
